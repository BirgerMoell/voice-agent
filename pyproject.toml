[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offline-voice-agent"
version = "0.1.0"
description = "A modular, fully local speech-to-speech agent for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Birger Moell" }]
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
apple = [
  "huggingface_hub[hf_xet]",
  "mlx-audio",
  "parakeet-mlx==0.5.2",
  "supertonic==1.3.1",
  "misaki[en]",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
voice-agent = "offline_voice_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
